# WordPress -> Django migration: everything in one compose project.
#
#   wp-db                 the original WordPress MariaDB, loaded from wordpress/db/dump.sql
#   main, main-db         the Django site (pages, API) and its Postgres
#   auth, auth-db         the auth service and its Postgres
#   jwt-keys, assets      one-off jobs on `up`: token keys, CSS/JS build
#   *-wp-import           one-off jobs: wp-db -> main / auth (run by ./setup.sh)
#   wordpress             the original WP site, for comparison (profile "wordpress")
#
# The running Django services never read wp-db; only the import jobs do.
name: ca-django

x-main-base: &main-base
  build:
    context: ./main
    additional_contexts:
      shared: ./shared
  image: ca-django/main:dev
  environment: &main-env
    DJANGO_SECRET_KEY: ${MAIN_SECRET_KEY:?set MAIN_SECRET_KEY in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_HOST: main-db
    POSTGRES_DB: ${MAIN_DB_NAME:-main}
    POSTGRES_USER: ${MAIN_DB_USER:-main}
    POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-main}
    # Verifies tokens with the public key only (never sees the private key).
    JWT_PUBLIC_KEY_FILE: /keys/public/jwt_public.pem
    JWT_ISSUER: ${JWT_ISSUER:-brand-reviews-auth}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-brand-reviews-main}
  volumes:
    - ./main:/app
    - jwt_public:/keys/public:ro
  depends_on:
    main-db:
      condition: service_healthy
    jwt-keys:
      condition: service_completed_successfully

x-auth-build: &auth-build
  context: ./auth_service
  additional_contexts:
    shared: ./shared

x-auth-base: &auth-base
  build: *auth-build
  image: ca-django/auth:dev
  environment: &auth-env
    DJANGO_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_HOST: auth-db
    POSTGRES_DB: ${AUTH_DB_NAME:-auth}
    POSTGRES_USER: ${AUTH_DB_USER:-auth}
    POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    JWT_PRIVATE_KEY_FILE: /keys/private/jwt_private.pem
    JWT_ISSUER: ${JWT_ISSUER:-brand-reviews-auth}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-brand-reviews-main}
    ACCESS_TOKEN_LIFETIME_SECONDS: ${ACCESS_TOKEN_LIFETIME_SECONDS:-900}
  volumes:
    - ./auth_service:/app
    - jwt_private:/keys/private:ro
  depends_on:
    auth-db:
      condition: service_healthy
    jwt-keys:
      condition: service_completed_successfully

# Connection to the WordPress MariaDB (the wp-db service), used only by the import jobs.
x-wp-source-env: &wp-source-env
  WP_DB_HOST: wp-db
  WP_DB_PORT: 3306
  WP_DB_NAME: ${WP_DB_NAME:-wp}
  WP_DB_USER: ${WP_DB_USER:-wp}
  WP_DB_PASSWORD: ${WP_DB_PASSWORD:-wp}
  WP_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}

services:
  # Creates the Ed25519 signing key pair on first run, then does nothing.
  # Private key -> jwt_private volume (mounted only into auth); public key ->
  # jwt_public volume (mounted into main). Neither is in the repository.
  # Replace the pair: docker compose run --rm jwt-keys python manage.py generate_jwt_keys --force
  jwt-keys:
    build: *auth-build
    image: ca-django/auth:dev
    environment:
      DJANGO_SECRET_KEY: key-generation-only
      JWT_PRIVATE_KEY_FILE: /keys/private/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /keys/public/jwt_public.pem
    volumes:
      - jwt_private:/keys/private
      - jwt_public:/keys/public
    command: python manage.py generate_jwt_keys

  # The original WordPress database, from the unchanged WordPress source in
  # wordpress/. The dump is loaded on the first start (empty volume), ~20 s.
  # No host port: only the import jobs (and the optional site) connect to it.
  wp-db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WP_DB_NAME:-wp}
      MYSQL_USER: ${WP_DB_USER:-wp}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-wp}
    volumes:
      - wp_db_data:/var/lib/mysql
      - ./wordpress/db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The original WordPress site at http://localhost:8080 (its URL is fixed in
  # the dump), to compare with the Django pages. Optional:
  #   docker compose --profile wordpress up -d wordpress
  # wordpress/wp-content is mounted read-only at /src and copied into the
  # container's own volume on start, so the container never changes repo files.
  wordpress:
    profiles: ["wordpress"]
    image: wordpress:6.9-php8.3-apache
    depends_on:
      wp-db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: wp-db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
    volumes:
      - wp_files:/var/www/html
      - ./wordpress/wp-content:/src/wp-content:ro
    entrypoint:
      - bash
      - -ec
      - |
        # WordPress core from the image (first start only).
        [ -e /var/www/html/wp-includes/version.php ] || cp -a /usr/src/wordpress/. /var/www/html/
        # The challenge's plugins, must-use plugins and theme, refreshed on every start.
        wpc=/var/www/html/wp-content
        mkdir -p "$$wpc/uploads"
        rm -rf "$$wpc/plugins" "$$wpc/mu-plugins" "$$wpc/themes/consumer-reviews"
        cp -r /src/wp-content/plugins /src/wp-content/mu-plugins "$$wpc/"
        cp -r /src/wp-content/themes/consumer-reviews "$$wpc/themes/"
        chown -R www-data:www-data "$$wpc"
        # Writes wp-config.php from the WORDPRESS_* settings, then starts Apache.
        exec docker-entrypoint.sh apache2-foreground

  main-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MAIN_DB_NAME:-main}
      POSTGRES_USER: ${MAIN_DB_USER:-main}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-main}
    volumes:
      - main_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  main:
    <<: *main-base
    ports:
      - "${MAIN_PORT:-8000}:8000"
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"

  auth:
    <<: *auth-base
    ports:
      - "${AUTH_PORT:-8001}:8000"
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"

  # Builds frontend/ into main/static (scss -> css/main.css, React -> js/brand-list.js),
  # then exits. Runs on every `docker compose up`; other commands (see README):
  #   docker compose run --rm assets npm run check      (CSS check, typecheck, tests)
  #   docker compose run --rm assets npm run watch:css  (or watch:js; rebuild on save)
  assets:
    build: ./frontend  # node:22-alpine + npm 11.6.2 (the version pinned in package.json)
    image: ca-django/assets:dev
    user: "1000:1000"  # the image's "node" user; files it writes belong to the host user
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - ./main/static:/app/main/static
      - ./main/templates:/app/main/templates:ro  # read by check:css
    # Installs the locked dependencies, then runs the given npm command.
    entrypoint: ["sh", "-c", "[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund --loglevel=error; exec \"$$@\"", "--"]
    command: ["npm", "run", "build"]

  # The shared package's own tests, outside both Django projects:
  #   docker compose run --rm --build shared-tests
  shared-tests:
    profiles: ["test"]
    build:
      context: ./shared
      dockerfile: Dockerfile.test
    image: ca-django/shared-tests:dev

  # docker compose run --rm main-wp-import [--dry-run] [--prune]   (setup.sh runs it)
  main-wp-import:
    <<: *main-base
    profiles: ["import"]
    volumes:  # the code only; no key volume (the import never touches tokens)
      - ./main:/app
    environment:
      <<: [*main-env, *wp-source-env]
    depends_on:
      main-db:
        condition: service_healthy
      wp-db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py import_wp \"$$@\"", "--"]
    command: []

  # docker compose run --rm auth-wp-import [--dry-run] [--prune]   (setup.sh runs it)
  auth-wp-import:
    <<: *auth-base
    profiles: ["import"]
    volumes:  # the code only; the private key stays with the running auth service
      - ./auth_service:/app
    environment:
      <<: [*auth-env, *wp-source-env]
      AUTH_IMPORT_PASSWORD: ${AUTH_IMPORT_PASSWORD:-}
    depends_on:
      auth-db:
        condition: service_healthy
      wp-db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py import_wp_users \"$$@\"", "--"]
    command: []

volumes:
  wp_db_data:
  wp_files:
  main_db_data:
  auth_db_data:
  jwt_private:
  jwt_public:
